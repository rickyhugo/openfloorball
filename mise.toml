[tools]
node = "26.13.0"
hk = "2.14.0"

[env]
_.path = ["node_modules/.bin"]

[tasks.dev]
run = "doppler run -- npm run dev"

[tasks.secrets]
run = "doppler secrets --only-names"

[tasks.lint]
run = "npm run lint"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.build]
run = "npm run build"

[tasks.format]
run = "npm run format"
