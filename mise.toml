[tools]
node = "26.13.0"
hk = "2.14.0"

[env]
_.path = ["node_modules/.bin"]

[tasks.dev]
run = "doppler run -- npm run dev"

[tasks.secrets]
run = "doppler secrets --only-names"

[tasks.lint]
run = "npm run lint"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.build]
run = "npm run build"

[tasks."db:generate"]
run = "doppler run -- drizzle-kit generate"

[tasks."db:migrate"]
run = "doppler run -- drizzle-kit migrate"

[tasks."ingest:collect"]
run = "tsx ingest/collect.ts"

[tasks."ingest:load"]
run = "doppler run -- tsx ingest/load.ts"

[tasks."ingest:check"]
run = "doppler run -- tsx ingest/check.ts"

[tasks."ingest:backfill"]
run = "bash ingest/backfill.sh"

[tasks."ingest:verify"]
run = "doppler run -- tsx ingest/verify.ts"

[tasks."db:studio"]
run = "doppler run -- drizzle-kit studio"

[tasks.format]
run = "npm run format"
